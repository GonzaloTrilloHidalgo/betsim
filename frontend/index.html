<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <title>BetSim — Mundial 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { overscroll-behavior-y: contain; }
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .sheet-enter { transform: translateY(100%); }
    .sheet-open { transform: translateY(0); }

    /* ===== Cuadro eliminatorio (bracket con líneas) ===== */
    .bkt { display: flex; min-width: max-content; }
    .bkt-round { display: flex; flex-direction: column; width: 168px; }
    .bkt-title {
      text-align: center; font-weight: 700; color: #34d399; font-size: .72rem;
      letter-spacing: .02em; padding-bottom: .5rem;
    }
    .bkt-list { display: flex; flex-direction: column; flex: 1; }
    .bkt-cell { flex: 1; display: flex; align-items: center; position: relative; padding: 4px 12px; }
    .bkt-card { width: 100%; }
    /* línea horizontal saliente (hacia la ronda siguiente) */
    .bkt-round:not(:last-child) .bkt-cell::after {
      content: ''; position: absolute; right: 0; top: 50%; width: 12px; height: 2px; background: #475569;
    }
    /* línea horizontal entrante (desde la ronda anterior) */
    .bkt-round:not(:first-child) .bkt-cell::before {
      content: ''; position: absolute; left: 0; top: 50%; width: 12px; height: 2px; background: #475569;
    }
    /* línea vertical que une cada pareja de partidos */
    .bkt-bus { position: absolute; right: 0; top: 50%; width: 2px; height: 100%; background: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 select-none">

  <!-- ===== Pantalla de autenticación ===== -->
  <div id="auth-screen" class="min-h-screen flex flex-col justify-center px-6 hidden">
    <div class="text-center mb-8">
      <div class="text-4xl font-extrabold text-green-500">BetSim</div>
      <div class="text-slate-400 mt-1">Mundial 2026 · juega con tus amigos</div>
    </div>
    <div class="bg-slate-800 rounded-2xl p-5 shadow-xl">
      <div class="flex mb-4 bg-slate-700 rounded-xl p-1">
        <button id="tab-login" class="flex-1 py-2 rounded-lg text-sm font-semibold bg-green-600">Entrar</button>
        <button id="tab-register" class="flex-1 py-2 rounded-lg text-sm font-semibold text-slate-300">Crear cuenta</button>
      </div>
      <div id="register-only" class="hidden">
        <input id="reg-email" type="email" placeholder="Email" autocomplete="email"
               class="w-full mb-3 px-4 py-3 rounded-xl bg-slate-700 outline-none" />
      </div>
      <input id="auth-username" type="text" placeholder="Usuario" autocomplete="username"
             class="w-full mb-3 px-4 py-3 rounded-xl bg-slate-700 outline-none" />
      <input id="auth-password" type="password" placeholder="Contraseña" autocomplete="current-password"
             class="w-full mb-4 px-4 py-3 rounded-xl bg-slate-700 outline-none" />
      <button id="auth-submit" class="w-full py-3 rounded-xl bg-green-600 font-bold active:bg-green-700">Entrar</button>
      <p id="auth-error" class="text-red-400 text-sm mt-3 text-center min-h-[1.25rem]"></p>
    </div>
  </div>

  <!-- ===== App principal ===== -->
  <div id="app" class="hidden min-h-screen flex flex-col">
    <!-- Header con saldo -->
    <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between"
            style="padding-top: env(safe-area-inset-top);">
      <div class="font-extrabold text-green-500 text-lg">BetSim</div>
      <div class="text-right">
        <div class="text-[11px] text-slate-400 leading-none">Saldo</div>
        <div id="hdr-balance" class="font-bold text-green-400">—</div>
      </div>
    </header>

    <!-- Contenido -->
    <main id="content" class="flex-1 overflow-y-auto no-scrollbar px-4 py-4 pb-28 w-full"></main>

    <!-- Bet slip flotante (bottom sheet) -->
    <div id="slip-backdrop" class="hidden fixed inset-0 bg-black/50 z-30"></div>
    <div id="slip" class="fixed left-0 right-0 bottom-0 z-40 bg-slate-800 rounded-t-3xl shadow-2xl
                          transition-transform duration-300 sheet-enter">
      <div id="slip-handle" class="pt-3 pb-2 flex justify-center cursor-pointer">
        <div class="w-12 h-1.5 rounded-full bg-slate-600"></div>
      </div>
      <div class="px-5 pb-6" style="padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold">Boleto <span id="slip-count" class="text-green-400"></span></h3>
          <button id="slip-clear" class="text-sm text-slate-400">Vaciar</button>
        </div>
        <div id="slip-items" class="space-y-2 max-h-52 overflow-y-auto no-scrollbar mb-3"></div>
        <div class="flex items-center justify-between text-sm text-slate-300 mb-2">
          <span>Cuota total</span><span id="slip-total" class="font-bold text-slate-100">—</span>
        </div>
        <div class="flex items-center gap-3 mb-3">
          <input id="slip-stake" type="number" min="1" inputmode="decimal" placeholder="Importe"
                 class="flex-1 px-4 py-3 rounded-xl bg-slate-700 outline-none" />
          <div class="text-right">
            <div class="text-[11px] text-slate-400 leading-none">Ganancia</div>
            <div id="slip-return" class="font-bold text-green-400">—</div>
          </div>
        </div>
        <button id="slip-confirm" class="w-full py-3 rounded-xl bg-green-600 font-bold active:bg-green-700">
          Confirmar apuesta
        </button>
        <p id="slip-error" class="text-red-400 text-sm mt-2 text-center min-h-[1.25rem]"></p>
      </div>
    </div>

    <!-- Pestaña flotante "ver boleto" cuando el sheet está cerrado -->
    <button id="slip-fab" class="hidden fixed left-1/2 -translate-x-1/2 bottom-20 z-30
                                 bg-green-600 text-white font-bold px-5 py-3 rounded-full shadow-lg active:bg-green-700">
      Boleto · <span id="fab-count">0</span>
    </button>

    <!-- Bottom navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-20 bg-slate-900 border-t border-slate-800 grid grid-cols-4"
         style="padding-bottom: env(safe-area-inset-bottom);">
      <button data-tab="cartelera" class="nav-btn flex flex-col items-center justify-center py-2 min-h-[56px] text-green-500">
        <span class="text-xl">⚽</span><span class="text-[11px] mt-0.5">Cartelera</span>
      </button>
      <button data-tab="apuestas" class="nav-btn flex flex-col items-center justify-center py-2 min-h-[56px] text-slate-400">
        <span class="text-xl">🎫</span><span class="text-[11px] mt-0.5">Mis Apuestas</span>
      </button>
      <button data-tab="cuadro" class="nav-btn flex flex-col items-center justify-center py-2 min-h-[56px] text-slate-400">
        <span class="text-xl">🏆</span><span class="text-[11px] mt-0.5">Cuadro</span>
      </button>
      <button data-tab="billetera" class="nav-btn flex flex-col items-center justify-center py-2 min-h-[56px] text-slate-400">
        <span class="text-xl">💰</span><span class="text-[11px] mt-0.5">Billetera</span>
      </button>
    </nav>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
