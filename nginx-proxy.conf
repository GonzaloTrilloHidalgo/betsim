# nginx para desarrollo local: sirve la PWA y hace de proxy de la API al backend.
# Así todo va por el mismo puerto (5500) y funciona también desde el móvil por la IP de tu PC.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas /api/* se reenvían al backend (mismo origen -> sin problemas de CORS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
