spring:
  application:
    name: betsim-backend
  datasource:
    # DB_URL directo (docker-compose) o construido desde host/puerto/nombre (Render usa estas variables).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:betsim}}
    username: ${DB_USER:betsim}
    password: ${DB_PASSWORD:betsim}
  web:
    resources:
      # En producción el backend sirve la PWA desde esta carpeta (ver Dockerfile de despliegue).
      static-locations: ${BETSIM_FRONTEND_PATH:classpath:/static/}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

betsim:
  # Economía (ver ARQUITECTURA_Y_PLAN.md §10)
  economy:
    starting-balance: 50.00
    daily-bonus: 10.00
  # Seguridad JWT. En producción, define BETSIM_JWT_SECRET (>= 32 bytes).
  jwt:
    secret: ${BETSIM_JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  # Proveedor de datos deportivos: "mock" (sin coste, datos simulados) | "theoddsapi"
  provider:
    type: ${BETSIM_PROVIDER:mock}
    sport-key: ${BETSIM_SPORT_KEY:soccer_fifa_world_cup}
    odds-api-key: ${ODDS_API_KEY:}
    region: ${BETSIM_ODDS_REGION:eu}
    results-cache: ${BETSIM_RESULTS_CACHE:PT15M}
  # Frecuencia de las tareas programadas (formato ISO-8601, p. ej. PT30M = 30 min).
  jobs:
    odds-interval: ${BETSIM_ODDS_INTERVAL:PT30M}
    settlement-interval: ${BETSIM_SETTLEMENT_INTERVAL:PT5M}
  # football-data.org: resultados completos y cuadro del Mundial (solo visualización).
  football-data:
    api-key: ${FOOTBALL_DATA_API_KEY:}
    competition: ${FOOTBALL_DATA_COMPETITION:WC}
    cache: ${FOOTBALL_DATA_CACHE:PT10M}
  cors:
    # "*" permite cualquier origen (cómodo para acceder desde el móvil por IP). Seguro con JWT en cabecera.
    allowed-origins: ${BETSIM_CORS_ORIGINS:*}

logging:
  level:
    com.betsim: INFO

---
# Perfil de desarrollo rápido: H2 en memoria, sin necesidad de Postgres.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:betsim;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
