spring:
  application:
    name: betsim-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/betsim}
    username: ${DB_USER:betsim}
    password: ${DB_PASSWORD:betsim}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

betsim:
  # Economía (ver ARQUITECTURA_Y_PLAN.md §10)
  economy:
    starting-balance: 50.00
    daily-bonus: 10.00
  # Seguridad JWT. En producción, define BETSIM_JWT_SECRET (>= 32 bytes).
  jwt:
    secret: ${BETSIM_JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  # Proveedor de datos deportivos: "mock" (sin coste, datos simulados) | "theoddsapi"
  provider:
    type: ${BETSIM_PROVIDER:mock}
    sport-key: soccer_fifa_world_cup
    odds-api-key: ${ODDS_API_KEY:}
  cors:
    allowed-origins: ${BETSIM_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

logging:
  level:
    com.betsim: INFO

---
# Perfil de desarrollo rápido: H2 en memoria, sin necesidad de Postgres.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:betsim;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
